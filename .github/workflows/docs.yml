name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/docs.yml"
  push:
    branches: [dev]
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "**/*.md"
          fail: true
