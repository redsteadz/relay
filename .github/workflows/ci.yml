name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - if: github.event_name == 'workflow_dispatch'
        run: pnpm build
      - if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter @relay/mobile build-config:check
      - if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter @relay/api cf-typegen:check
      - if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter @relay/api build:worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://relay-build.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-build-only
