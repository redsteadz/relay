name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @relay/mobile build-config:check
      - run: pnpm --filter @relay/api cf-typegen:check
      - run: pnpm --filter @relay/api build:worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://relay-build.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-build-only

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELAY_AUTH_SITE_URL: http://localhost:3000
      RELAY_AUTH_WEB_REDIRECT_URL: http://localhost:8081/auth/callback
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - run: pnpm exec supabase db reset
      - run: pnpm exec supabase test db
      - run: pnpm supabase:types:check
      - run: pnpm e2e:local
      - if: always()
        run: pnpm exec supabase stop --no-backup
