name: Graphify Memory

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    name: Directed knowledge graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "graphifyy[gemini,sql]==0.9.49"
      - name: Require semantic extraction key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY"
      - name: Build graph
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          graphify extract . --backend gemini --model gemini-2.5-flash-lite --mode deep --force --no-cluster --token-budget 5000 --max-concurrency 1
          graphify extract . --backend gemini --model gemini-2.5-flash-lite --mode deep --no-cluster --token-budget 2000 --max-concurrency 1
      - name: Validate directed graph
        run: python scripts/validate-graphify.py
      - uses: actions/upload-artifact@v4
        with:
          name: relay-knowledge-graph
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
          if-no-files-found: error
          retention-days: 14
