<!--
  The Android adaptive icon's foreground layer: the glyph alone, on transparency.

  The background is a flat colour supplied by app.config.ts from the theme palette, so it is not
  drawn here. The glyph is held to half the canvas width because an adaptive icon's 1024px layer
  maps to 108dp of which only the central 72dp is guaranteed visible, and a launcher may mask that
  to a circle, so the glyph's full diagonal has to fit inside it rather than just its width.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-7 -7 46 46" fill="none" stroke-linecap="round" stroke-width="3">
  <path d="M6 9c5 0 6.7 7 10 7M6 16h10M6 23c5 0 6.7-7 10-7" stroke="#F4EFE6"/>
  <path d="M16 16h10" stroke="#F08B5E"/>
</svg>
