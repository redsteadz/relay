<!--
  The themed-icon layer for Android 13 and later, where the system recolours the icon to match the
  wallpaper. It is read as an alpha mask, so every stroke is one flat colour: keeping the mark's
  cream and orange here would be discarded, and the orange routed line would silently merge into
  the rest. Same geometry as the foreground layer.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-7 -7 46 46" fill="none" stroke-linecap="round" stroke-width="3">
  <path d="M6 9c5 0 6.7 7 10 7M6 16h10M6 23c5 0 6.7-7 10-7M16 16h10" stroke="#FFFFFF"/>
</svg>
