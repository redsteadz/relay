project_id = "relay"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55323

[auth]
enabled = true
site_url = "env(RELAY_AUTH_SITE_URL)"
additional_redirect_urls = ["com.redsteadz.relay://auth/callback", "env(RELAY_AUTH_WEB_REDIRECT_URL)"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[local_smtp]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326

[analytics]
enabled = true
port = 55327
